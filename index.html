<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クベバ · Kubeba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --paper:#ece6d6; --surface:#f7f2e8; --surface-2:#efe9db; --raised:#fbf8f1;
  --ink:#221f19; --ink-soft:#6b6455; --line:#ddd4c1;
  --indigo:#2a3c74; --indigo-2:#3b4f8f; --indigo-soft:#e3e6f1;
  --shu:#d24e24; --shu-soft:#f3ddd2;
  --matcha:#5f7a43; --matcha-soft:#e6ecda;
  --amber:#c1892e;
  --radius:16px; --radius-sm:11px; --radius-lg:24px;
  --shadow:0 1px 2px rgba(40,34,20,.06), 0 8px 24px -12px rgba(40,34,20,.18);
  --jp-serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC","Noto Serif JP",serif;
  --jp-sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",sans-serif;
  --ui:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141310; --surface:#201e18; --surface-2:#26231c; --raised:#2b281f;
    --ink:#ece6d7; --ink-soft:#a49c88; --line:#37332a;
    --indigo:#93a6dd; --indigo-2:#aab9e6; --indigo-soft:#232a40;
    --shu:#e2662f; --shu-soft:#3a251b;
    --matcha:#9db56f; --matcha-soft:#2a301f;
    --amber:#d6a24a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141310; --surface:#201e18; --surface-2:#26231c; --raised:#2b281f;
  --ink:#ece6d7; --ink-soft:#a49c88; --line:#37332a;
  --indigo:#93a6dd; --indigo-2:#aab9e6; --indigo-soft:#232a40;
  --shu:#e2662f; --shu-soft:#3a251b;
  --matcha:#9db56f; --matcha-soft:#2a301f;
  --amber:#d6a24a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-weight:400; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
.jp{font-family:var(--jp-sans)}
.serif{font-family:var(--jp-serif)}

/* layout */
#app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}
.wrap{padding:16px 18px 40px}
.center-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px}

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 18px; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:baseline; gap:8px}
.brand .mark{font-family:var(--jp-serif); font-size:22px; font-weight:500; letter-spacing:.02em}
.brand .sub{font-size:11px; color:var(--ink-soft); letter-spacing:.14em; text-transform:uppercase}
.icon-btn{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--ink-soft)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.mode{font-weight:800; font-size:16px; border:1px solid var(--line); background:var(--surface)}
.mode-link{display:block; text-align:center; margin-top:12px; color:var(--ink-soft); font-size:13px}
.mode-link u{text-decoration-thickness:1px; text-underline-offset:3px}

/* stat header */
.stats-row{display:flex; gap:10px; margin-bottom:18px}
.stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow)}
.stat .k{font-size:11px; color:var(--ink-soft); letter-spacing:.06em; display:flex; align-items:center; gap:5px}
.stat .v{font-size:22px; font-weight:700; margin-top:3px; display:flex; align-items:baseline; gap:6px}
.stat .v small{font-size:12px; font-weight:500; color:var(--ink-soft)}
.flame{color:var(--shu)}

/* level bar */
.level-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow)}
.level-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px}
.level-top .lv{font-weight:700}
.level-top .xp{font-size:12px; color:var(--ink-soft)}
.bar{height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--indigo),var(--indigo-2)); border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1)}

/* xp chart */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow)}
.panel h3{margin:0 0 2px; font-size:14px; font-weight:700}
.panel .hint{font-size:12px; color:var(--ink-soft); margin:0 0 12px}
.chart{display:flex; align-items:flex-end; gap:5px; height:78px}
.chart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%}
.chart .barwrap{flex:1; width:100%; display:flex; align-items:flex-end}
.chart .b{width:100%; background:linear-gradient(180deg,var(--indigo-2),var(--indigo)); border-radius:5px 5px 3px 3px; min-height:3px; transition:height .5s cubic-bezier(.22,1,.36,1)}
.chart .b.today{background:linear-gradient(180deg,var(--shu),#b8431f)}
.chart .lbl{font-size:9px; color:var(--ink-soft)}

/* path */
.section-title{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:22px 4px 12px}
.path{display:flex; flex-direction:column; gap:0}
.node{display:flex; align-items:center; gap:14px; padding:10px 0; position:relative}
.node .rail{position:absolute; left:27px; top:-2px; bottom:-2px; width:2px; background:var(--line); z-index:0}
.node:first-child .rail{top:50%}
.node:last-child .rail{bottom:50%}
.ring{position:relative; width:56px; height:56px; flex:none; border-radius:50%; z-index:1;
  display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow)}
.ring .fill{position:absolute; inset:-1px; border-radius:50%; }
.ring .inner{position:relative; width:44px; height:44px; border-radius:50%; background:var(--raised);
  display:grid; place-items:center; font-family:var(--jp-serif); font-size:20px}
.ring.done .inner{background:var(--matcha-soft)}
.node .meta{flex:1; min-width:0}
.node .meta .nm{font-weight:700; font-size:15px}
.node .meta .ds{font-size:12px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap}
.pill{font-size:10.5px; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line)}
.pill.new{background:var(--shu-soft); color:var(--shu); border-color:transparent; font-weight:700}
.pill.due{background:var(--indigo-soft); color:var(--indigo); border-color:transparent; font-weight:700}
.pill.master{background:var(--matcha-soft); color:var(--matcha); border-color:transparent; font-weight:700}
.node .go{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:var(--indigo); background:var(--indigo-soft)}
.node.locked .ring, .node.locked .meta{opacity:.45}
.node .go.skip{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line)}
.node .go.skip:active{transform:scale(.94)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:15px 18px; border-radius:14px; font-weight:700; font-size:16px;
  background:var(--indigo); color:#fff; box-shadow:0 3px 0 color-mix(in srgb,var(--indigo) 60%, #000); transition:transform .06s, box-shadow .06s}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 color-mix(in srgb,var(--indigo) 60%, #000)}
.btn.shu{background:var(--shu); box-shadow:0 3px 0 color-mix(in srgb,var(--shu) 55%, #000)}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow)}
.btn.big{padding:17px}
.btn[disabled]{opacity:.45; pointer-events:none}
.daily-cta{margin-bottom:6px}

/* lesson */
.lesson-head{display:flex; align-items:center; gap:12px; padding:12px 18px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--paper); z-index:5}
.lesson-head .close{font-size:22px; color:var(--ink-soft); width:34px; height:34px; border-radius:10px}
.progress{flex:1; height:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--matcha),#77934f); border-radius:99px; transition:width .35s cubic-bezier(.22,1,.36,1)}
.combo{display:flex; align-items:center; gap:4px; font-weight:800; color:var(--shu); font-size:15px; min-width:44px; justify-content:flex-end; opacity:0; transition:opacity .2s}
.combo.on{opacity:1}
.stage{padding:8px 18px 210px}
.kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 14px; text-align:center}
.prompt{text-align:center; margin:8px 0 26px}
.prompt .big{font-family:var(--jp-serif); font-size:clamp(38px,13vw,64px); line-height:1.1; font-weight:500}
.prompt .en{font-size:clamp(22px,6vw,30px); font-weight:700}
.prompt .rd{color:var(--ink-soft); margin-top:8px; font-size:15px}

/* choices */
.choices{display:grid; gap:11px}
.choice{display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line); font-size:17px; font-weight:500; text-align:left; box-shadow:var(--shadow); transition:border-color .12s, background .12s}
.choice .jpc{font-family:var(--jp-sans)}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:var(--matcha); background:var(--matcha-soft)}
.choice.wrong{border-color:var(--shu); background:var(--shu-soft)}
.choice.dim{opacity:.5}
.choice .badge{margin-left:auto; font-weight:800}
.choices.grid2{grid-template-columns:1fr 1fr}
.choice.kana-choice{justify-content:center; font-family:var(--jp-serif); font-size:34px; padding:18px 10px}

/* build */
.answer-line{min-height:58px; border:1.5px dashed var(--line); border-radius:14px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; margin-bottom:8px; background:var(--surface)}
.answer-line.correct{border-color:var(--matcha); border-style:solid; background:var(--matcha-soft)}
.answer-line.wrong{border-color:var(--shu); border-style:solid; background:var(--shu-soft)}
.bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px}
.tile{font-family:var(--jp-sans); font-size:18px; font-weight:500; padding:10px 14px; border-radius:11px; background:var(--raised); border:1.5px solid var(--line); box-shadow:0 2px 0 var(--line)}
.tile:active{transform:translateY(1px)}
.tile.used{visibility:hidden}
.tile.placed{background:var(--indigo-soft); border-color:transparent}

/* type */
.type-in{width:100%; padding:15px 16px; font-size:19px; font-family:var(--ui); border-radius:14px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); text-align:center; box-shadow:var(--shadow)}
.type-in:focus{outline:none; border-color:var(--indigo)}
.type-in.correct{border-color:var(--matcha); background:var(--matcha-soft)}
.type-in.wrong{border-color:var(--shu); background:var(--shu-soft)}
.verdict{text-align:center; margin-top:16px; font-weight:700; min-height:24px}
.verdict.ok{color:var(--matcha)} .verdict.no{color:var(--shu)}
.verdict .sol{font-family:var(--jp-sans); font-weight:800}

/* footer action bar */
.actionbar{position:fixed; left:0; right:0; bottom:0; z-index:6; padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px)); background:color-mix(in srgb,var(--paper) 92%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line)}
.actionbar .inner{max-width:560px; margin:0 auto}
.override{display:block; width:100%; text-align:center; margin-top:10px; color:var(--ink-soft); font-size:13px; font-weight:600}
.override u{text-decoration-thickness:1px; text-underline-offset:3px}

/* complete */
.complete{text-align:center; padding:30px 22px}
.complete .seal{width:98px; height:98px; margin:6px auto 18px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--jp-serif); font-size:40px; color:#fff; background:radial-gradient(circle at 35% 30%, var(--shu), #a83c1a);
  box-shadow:0 10px 30px -8px color-mix(in srgb,var(--shu) 60%, transparent)}
.complete h2{margin:0 0 4px; font-size:24px}
.complete .lead{color:var(--ink-soft); margin:0 0 22px}
.result-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:24px}
.result{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow)}
.result .rk{font-size:11px; color:var(--ink-soft); letter-spacing:.06em}
.result .rv{font-size:26px; font-weight:800; margin-top:4px}

/* confetti */
#fx{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden}
.cf{position:absolute; width:9px; height:14px; border-radius:2px; will-change:transform,opacity}
.burst{position:fixed; left:50%; top:42%; transform:translate(-50%,-50%) scale(.6); z-index:51;
  font-weight:900; font-size:30px; color:var(--shu); text-align:center; pointer-events:none;
  font-family:var(--ui); opacity:0}
.burst .n{font-family:var(--jp-serif); font-size:52px; display:block; line-height:1}
@keyframes pop{0%{opacity:0; transform:translate(-50%,-50%) scale(.5)}18%{opacity:1; transform:translate(-50%,-50%) scale(1.12)}80%{opacity:1; transform:translate(-50%,-50%) scale(1)}100%{opacity:0; transform:translate(-50%,-56%) scale(1)}}
.burst.go{animation:pop 1.15s cubic-bezier(.22,1,.36,1) forwards}
.burst.lvl{color:var(--indigo)}
.burst.lvl .n{font-size:64px}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(10px); z-index:52; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:99px; font-weight:700; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; box-shadow:var(--shadow); white-space:nowrap; max-width:92vw}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.frz{color:var(--indigo)}
.spk{display:inline-grid; place-items:center; width:38px; height:38px; border-radius:11px; background:var(--surface-2); border:1px solid var(--line); font-size:17px; vertical-align:middle; margin-left:12px; line-height:1}
.spk:active{transform:scale(.93)}
.verdict .spk{width:32px; height:32px; font-size:15px; margin-left:8px}
.spk-pair{display:inline-flex; gap:6px; margin-left:10px; vertical-align:middle}
.spk-pair .spk{margin-left:0}
.words-link{font-size:12px; letter-spacing:.03em; text-transform:none; color:var(--indigo); font-weight:700}
.search-bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:4; padding:10px 18px; background:color-mix(in srgb,var(--paper) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.word-search{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--ui); font-size:16px}
.word-search:focus{outline:none; border-color:var(--indigo)}
.words-wrap{padding-top:10px}
.word-group{display:flex; align-items:center; gap:8px; margin:18px 2px 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
.word-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); margin-bottom:7px; box-shadow:var(--shadow)}
.word-row.locked{opacity:.55}
.wdot{width:10px; height:10px; border-radius:50%; flex:none}
.wlock{width:14px; text-align:center; flex:none; font-size:12px}
.w-jp{font-family:var(--jp-sans); font-size:20px; min-width:62px}
.w-meta{flex:1; min-width:0}
.w-rd{font-size:12px; color:var(--ink-soft)}
.w-en{font-size:14px}
.word-row .spk{margin-left:auto}
.modal-ov{position:fixed; inset:0; z-index:60; background:rgba(20,17,10,.55); display:flex; align-items:flex-end; justify-content:center}
.modal{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow); max-height:88vh; overflow:auto; animation:sheet .25s cubic-bezier(.22,1,.36,1)}
@keyframes sheet{from{transform:translateY(30px); opacity:.6}to{transform:none; opacity:1}}
.modal-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.modal-h h3{margin:0; font-size:17px}
.io-area{width:100%; min-height:120px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.4; border:1.5px solid var(--line); border-radius:12px; padding:10px; background:var(--raised); color:var(--ink); resize:vertical}
.io-area:focus{outline:none; border-color:var(--indigo)}
.modal .btn{margin-top:12px}

.name-row{display:flex; gap:9px; margin-top:6px; flex-wrap:nowrap}
.name-row input{flex:1 1 auto; min-width:0; width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--ui); font-size:16px}
.name-row button{flex:0 0 auto}
.name-row input:focus{outline:none; border-color:var(--indigo)}
.muted{color:var(--ink-soft); font-size:13px}
.loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--indigo);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important}}
</style>
</head>
<body>
<div id="app">
  <div class="center-screen loading">
    <div class="brand" style="flex-direction:column;align-items:center;gap:6px">
      <div class="mark serif" style="font-size:40px">クベバ</div>
      <div class="sub">Kubeba · Japanese</div>
    </div>
    <div class="spin" style="margin-top:8px"></div>
  </div>
</div>
<div id="fx"></div>

<script>
"use strict";
(function(){

/* ---------------- Course content (curated, Genki-style arc) ----------------
   Vocabulary + example phrases authored for this app; not copied from Genki.
   Each item: {id, jp, romaji, en, parts?} grouped under a topic.        */
// [jp, romaji, altAccepted?] — en shown in MC is the romaji; alt spellings are accepted when typing
const kana = (list)=>list.map(([jp,romaji,alt,en])=>({jp,romaji,en:en||romaji,alt:alt||[],tags:["kana"],
  script: /[\u30a0-\u30ff]/.test(jp)?"kata":"hira"}));

// visually confusable kana — preferred as multiple-choice distractors
const LOOKALIKES = [
  ["ぬ","め"],["わ","れ","ね"],["は","ほ","ま"],["さ","き","ち"],["る","ろ"],["あ","お"],["い","り"],["う","つ"],["こ","に"],["け","は"],["た","な"],["す","む"],["そ","ろ"],["ゆ","よ"],
  ["ば","ぱ","は"],["び","ぴ"],["ぶ","ぷ"],["べ","ぺ"],["ぼ","ぽ"],["ざ","さ"],["じ","ぢ"],["ず","づ"],["だ","た"],["ぎ","き"],
  ["シ","ツ","ソ","ン"],["ク","ケ","タ","ワ"],["ア","マ","ヤ"],["ウ","ワ","フ","ラ"],["コ","ユ","ヨ","ロ"],["ス","ヌ"],["ナ","メ"],["チ","テ"],["ノ","メ"],["ホ","オ"],["セ","サ"],["ル","レ"],
  ["バ","パ"],["ビ","ピ"],["ブ","プ"],["ベ","ペ"],["ボ","ポ"],["ジ","ヂ"],["ズ","ヅ"]
];
const LOOK = {}; LOOKALIKES.forEach(g=>g.forEach(c=>{ LOOK[c]=(LOOK[c]||[]).concat(g.filter(x=>x!==c)); }));

const COURSE = {
  title:"Japanese",
  topics:[
    { id:"kana1", name:"Hiragana · あ–そ", glyph:"あ", tag:"kana",
      items: kana([["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
        ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],

const CFG = {
  newPerLesson: 5,
  lessonSize: 12,
  dailyMax: 20,
  targetR: 0.9,            // review when recall prob would drop to this
  comboEvery: 5,
  recordMin: 20,           // only celebrate beating a personal best above this
  xp:{ mc:8, build:12, type:15, easyBonus:4, comboBonus:20 },

const DAY = 86400000;
const now = ()=>Date.now();
const todayStr = (d=new Date())=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const daysAgo = (n)=>{ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-n); return d; }; // local-calendar safe across DST

/* ---------------- Storage (on-device; export/import to move it) ---------------- */
const LS_KEY = "kotoba.v1";
function blankProfile(){ return { name:"", memory:{}, xp:{total:0, byDay:{}}, streak:{current:0, longest:0, lastActive:""}, answerStreak:{current:0, best:0}, sound:true, theme:"", inputMode:"romaji" }; }
let profile = blankProfile();

let storeCorrupt=false;
function initStore(){
  let raw=null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  if(!raw) return;
  try{ profile = normalizeProfile(JSON.parse(raw)); }
  catch(e){
    // don't overwrite a corrupted save — park it so it can be recovered from Export/DevTools
    storeCorrupt=true;
    try{ localStorage.setItem(LS_KEY+".corrupt."+Date.now(), raw); }catch(e2){}
  }
}
function normalizeProfile(p){ const b=blankProfile(); return {
  name: p.name||"", memory:p.memory||{}, theme:p.theme||"",
  xp:{ total:(p.xp&&p.xp.total)||0, byDay:(p.xp&&p.xp.byDay)||{} },
  streak:{ current:(p.streak&&p.streak.current)||0, longest:(p.streak&&p.streak.longest)||0, lastActive:(p.streak&&p.streak.lastActive)||"" },
  answerStreak:{ current:(p.answerStreak&&p.answerStreak.current)||0, best:(p.answerStreak&&p.answerStreak.best)||0 },
  sound: p.sound!==false,
  inputMode: p.inputMode==="kana"?"kana":"romaji"
};}
let saveWarned=false;
function save(){
  try{
    const prev=localStorage.getItem(LS_KEY);
    if(prev) localStorage.setItem(LS_KEY+".bak", prev);   // one-step-back copy
    localStorage.setItem(LS_KEY, JSON.stringify(profile));
  }catch(e){
    if(!saveWarned){ saveWarned=true; toast("⚠ Couldn't save progress (private mode or storage full)"); }
  }
}

/* ---------------- FSRS-lite engine ----------------
   Confidence == retrievability R = 0.9^(elapsedDays / stability).
   Correct raises stability (more when R was low); wrong shrinks it. */
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mem(id){ return profile.memory[id]; }
function retrievability(m,t){ if(!m||!m.S) return 0; const e=(t-m.last)/DAY; return clamp(Math.pow(0.9, e/m.S),0,1); }
function confidence(id,t){ const m=mem(id); return m?retrievability(m,t):0; }
function isNew(id){ return !mem(id); }
function isDue(id,t){ const m=mem(id); return m && m.due<=t; }

function review(id, grade, t){
  const m = mem(id);
  let S,D,reps,lapses;
  if(!m){
    D = grade==="easy"?4 : grade==="again"?6.5 : 5;
    S = grade==="easy"?3 : grade==="again"?0.5 : 1.4;
    reps = 1; lapses = grade==="again"?1:0;
  } else {
    const R = retrievability(m,t);
    // reviewed early (not due, recall still ~certain) and got it right: no information gained,
    // so don't stretch the interval — just count the rep. Misses still shrink stability.
    if(grade!=="again" && m.due>t && R>0.95){ profile.memory[id] = Object.assign({}, m, {reps:m.reps+1}); return; }
    D = clamp(m.D + (grade==="again"?1.0 : grade==="easy"?-0.8 : -0.3), 1, 10);
    reps = m.reps+1; lapses = m.lapses + (grade==="again"?1:0);
    if(grade==="again"){
      S = Math.max(0.4, m.S*0.5);
    } else {
      const factor = grade==="easy"?3.0:1.8;
      const diffMod = (11-D)/6;
      S = m.S * (1 + factor*(1-R)*diffMod);
      S = Math.max(S, m.S*(grade==="easy"?1.5:1.2)); // guarantee growth
    }
  }
  const due = t + (S * Math.log(CFG.targetR)/Math.log(0.9)) * DAY; // = t + S days at targetR 0.9
  profile.memory[id] = { S, D, last:t, due, reps, lapses };
}

/* ---------------- XP / streak ---------------- */
function addXP(n){
  const before=levelInfo().lv;
  profile.xp.total += n;
  const d = todayStr();
  profile.xp.byDay[d] = (profile.xp.byDay[d]||0) + n;
  const after=levelInfo().lv;
  if(after>before) levelUp(after);
}
const XP_C = 90;   // level L starts at XP_C*(L-1)^2 → each level needs progressively more
function levelInfo(){
  const t=profile.xp.total;
  const lv=Math.floor(Math.sqrt(t/XP_C))+1;
  const base=XP_C*(lv-1)*(lv-1);
  const next=XP_C*lv*lv;
  return { lv, into:t-base, need:next-base, total:t };
}
function currentStreak(){
  // a streak only counts if you studied today or yesterday
  const s=profile.streak, d=todayStr(), y=todayStr(daysAgo(1));
  return (s.lastActive===d || s.lastActive===y) ? s.current : 0;
}
function touchStreak(){
  const d = todayStr(); const s = profile.streak;
  if(s.lastActive===d) return;
  const y = todayStr(daysAgo(1));
  s.current = (s.lastActive===y) ? s.current+1 : 1;
  s.lastActive = d;
  s.longest = Math.max(s.longest, s.current);
}

/* ---------------- Skip: mark earlier topics as known ---------------- */
// Seeds a memory record for every not-yet-studied word in the topics BEFORE
// targetIndex, so they enter review rotation. Due dates are staggered by
// position: the topic just before the start comes due first; the earliest
// (easiest, most foundational) topic comes due last. Never overwrites real progress.
function markKnownBefore(targetIndex){
  const T=now(); let seeded=0;
  for(let j=0;j<targetIndex;j++){
    const topic=COURSE.topics[j];
    const distance = targetIndex - j;         // 1 = topic just before start; larger = earlier/easier
    const dueDays = 1 + (distance-1)*1.5;      // earlier topics surface later
    topic.itemIds.forEach((id,k)=>{
      if(mem(id)) return;                      // keep any word you've actually studied
      profile.memory[id] = { S:6, D:4.5, reps:1, lapses:0, last:T, due: T + dueDays*DAY + k*2*3600*1000 };
      seeded++;
    });
  }
  if(seeded) save();
  return seeded;
}

/* ---------------- Session generator ---------------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function topicStats(t){
  const T=now(); let mastered=0, seen=0, due=0, fresh=0, sum=0;
  t.itemIds.forEach(id=>{ const m=mem(id);
    if(!m){ fresh++; } else { seen++; sum+=retrievability(m,T); if(m.due<=T)due++; if(m.S>=21 && m.reps>=3)mastered++; }
  });
  const avg = t.itemIds.length? (sum/t.itemIds.length):0;
  return {mastered, seen, due, fresh, avg, total:t.itemIds.length};
}
function isLockedIndex(i){
  const t=COURSE.topics[i];
  if(t.free || i===0) return false;
  const p=topicStats(COURSE.topics[i-1]);
  return p.seen < Math.ceil(p.total/2);
}
function buildTopicLesson(topicId){
  const T=now(); const t=TOPIC[topicId];
  const fresh = t.itemIds.filter(isNew).slice(0, CFG.newPerLesson);
  const freshSet = new Set(fresh);
  // due reviews across whole course, weakest first, topic's own first
  const due = ALL_IDS.filter(id=>isDue(id,T) && !freshSet.has(id))
    .sort((a,b)=> (TOPIC_OF[b]===topicId) - (TOPIC_OF[a]===topicId) || confidence(a,T)-confidence(b,T));
  let queue = fresh.concat(due).slice(0, Math.max(fresh.length, CFG.lessonSize));
  // top up with lowest-confidence seen topic items if short
  if(queue.length < Math.min(CFG.lessonSize, t.itemIds.length)){
    const have=new Set(queue);
    const extra = t.itemIds.filter(id=>!have.has(id)).sort((a,b)=>confidence(a,T)-confidence(b,T));
    queue = queue.concat(extra).slice(0, CFG.lessonSize);
  }
  return interleave(queue, freshSet);
}
function buildDaily(){
  const T=now();
  const due = ALL_IDS.filter(id=>isDue(id,T)).sort((a,b)=>confidence(a,T)-confidence(b,T)).slice(0,CFG.dailyMax);
  return {queue: due, freshSet:new Set()};
}
function interleave(queue, freshSet){
  // spread the "new" items out rather than clustering at the front
  const fresh = queue.filter(id=>freshSet.has(id));
  const rev = shuffle(queue.filter(id=>!freshSet.has(id)));
  if(!fresh.length) return {queue:rev, freshSet};
  const out=[]; const gap = Math.max(1, Math.floor((rev.length+fresh.length)/fresh.length));
  let fi=0, ri=0, k=0;
  while(fi<fresh.length || ri<rev.length){
    if(ri<rev.length){ out.push(rev[ri++]); k++; }
    if(fi<fresh.length && (k%gap===0 || ri>=rev.length)){ out.push(fresh[fi++]); }
  }
  return {queue:out, freshSet};
}

/* ---------------- Exercise selection ---------------- */
function chooseKind(id, isFresh){
  // use the confidence snapshot taken when the session began, so a card reviewed a moment ago isn't treated as 100%
  const c = (session && session.conf && id in session.conf) ? session.conf[id] : confidence(id, now());
  const it = ITEMS[id];
  const canBuild = it.parts && it.parts.length>=2;
  // items missed earlier this session come back as recognition, not production
  if(isFresh || c<0.5 || (session && session._requeued && session._requeued[id])) return "mc";
  if(c<0.8) return canBuild ? "build" : (Math.random()<0.5?"type":"mc");
  // high confidence → production. Phrases: type in kana when kana mode is on; in rōmaji mode
  // typing a whole sentence in rōmaji teaches little, so they stay on Build.
  if(canBuild) return kanaMode() ? (Math.random()<0.75?"type":"build") : "build";
  return "type";
}
function distractors(id, useJp, n){
  const it=ITEMS[id]; const tag=it.tags[0];
  let pool = ALL_IDS.filter(x=>x!==id && ITEMS[x].tags[0]===tag);
  if(tag==="kana"){
    // stay within the same script (hiragana vs katakana)
    pool = pool.filter(x=>ITEMS[x].script===it.script && ITEMS[x].jp.length===it.jp.length); // same script; singles vs きゃ-type digraphs
    // look-alikes first, then the rest of the script at random
    const near = shuffle(pool.filter(x=>(LOOK[it.jp]||[]).includes(ITEMS[x].jp)));
    const nearSet = new Set(near);
    // keep it honest: usually 1–2 look-alikes, never all four, so the odd one out isn't a giveaway
    const take = Math.min(near.length, 1+Math.floor(Math.random()*2));
    pool = near.slice(0,take).concat(shuffle(pool.filter(x=>!nearSet.has(x))));
  } else {
    pool = shuffle(pool);
  }
  if(pool.length<n) pool = pool.concat(shuffle(ALL_IDS.filter(x=>x!==id && !pool.includes(x))));
  // labels are compared literally (norm() would fold "o (wo)" into "o"); glyphs via norm()
  const lkey=v=>(v||"").toLowerCase().trim();
  const seen=new Set([useJp?norm(it.jp):lkey(it.en)]); const out=[];
  const ansJ=norm(it.jp), ansE=lkey(it.en);
  for(const x of pool){
    const o=ITEMS[x]; if(norm(o.jp)===ansJ || lkey(o.en)===ansE) continue; // same glyph (に kana vs に "two") or same label
    const v=useJp?o.jp:o.en; const k=useJp?norm(v):lkey(v);
    if(!seen.has(k)){ seen.add(k); out.push(v);} if(out.length>=n)break; }
  return out;
}
function norm(s){
  let v=(s||"").toString().normalize("NFKC").toLowerCase().trim()
    .replace(/[\s\u3000ー・.,!?;:'"()\-]/g,"").replace(/[、。！？「」]/g,"")
    .replace(/[\u30a1-\u30f6]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)); // katakana → hiragana so こーひー matches コーヒー
  // Unify romanisation styles: macrons, kunrei/IME spellings (si/ti/tu/hu/zi), を as wo/o.
  v=v.replace(/ō|ô/g,"oo").replace(/ū|û/g,"uu").replace(/ā|â/g,"aa").replace(/ī|î/g,"ii").replace(/ē|ê/g,"ee");
  v=v.replace(/sya/g,"sha").replace(/syu/g,"shu").replace(/syo/g,"sho").replace(/wo/g,"o");
  v=v.replace(/si/g,"shi").replace(/ti/g,"chi").replace(/tu/g,"tsu").replace(/(^|[^sc])hu/g,"$1fu").replace(/zi/g,"ji")
     .replace(/(?:tya|cya)/g,"cha").replace(/(?:tyu|cyu)/g,"chu").replace(/(?:tyo|cyo)/g,"cho")
     .replace(/(?:zya|jya)/g,"ja").replace(/(?:zyu|jyu)/g,"ju").replace(/(?:zyo|jyo)/g,"jo");
  // Collapse long vowels so "ohayou", "ohayō" and "ohayo" all compare equal.
  v=v.replace(/ou|oo/g,"o").replace(/uu/g,"u").replace(/ii/g,"i").replace(/ee/g,"e").replace(/aa/g,"a");
  return v; }

  (kids||[]).forEach(c=>{ if(c==null)return; el.appendChild(typeof c==="string"?document.createTextNode(c):c); });

}

function startSession(built,opts){
  if(!built.queue.length){ renderHome(); return; }
  session={ queue:built.queue.slice(), freshSet:built.freshSet||new Set(), i:0,
    total:built.queue.length, correct:0, wrong:0, xp:0, combo:profile.answerStreak.current, bestCombo:profile.answerStreak.current,
    advanced:new Set(), source:opts.source, topicId:opts.topicId, startTopic:opts.topicId?topicStats(TOPIC[opts.topicId]).mastered:0, conf:{},
    recordToBeat: profile.answerStreak.best, recordBroken:false };

      b.addEventListener("click",()=>{
        if(armed){ clearTimeout(timer); finishSession(true); return; }
        armed=true; b.innerHTML=""; b.style.width="auto"; b.style.fontSize="13px"; b.style.fontWeight="700"; b.style.padding="0 8px"; b.textContent="End lesson?";
        timer=setTimeout(()=>{ armed=false; b.innerHTML="✕"; b.style.width=""; b.style.fontSize=""; b.style.fontWeight=""; b.style.padding=""; },2500);
      });
      return b; })(),
    h("div",{class:"progress"},[ h("i",{style:"width:"+pct+"%"}) ]),
    combo
  ]);
}
function nextCard(){
  if(session.i>=session.queue.length){ finishSession(false); return; }
  presentCard();
}
function presentCard(forceKind){
  const id=session.queue[session.i];
  const isFresh=session.freshSet.has(id) && !mem(id);
  const kind=forceKind || chooseKind(id,isFresh);
  session._activeKind=kind;
  const stage=h("div",{class:"stage"});
  app.replaceChildren(sessionHead(), stage);
  (kind==="mc"?renderMC : kind==="build"?renderBuild : renderType)(id, kind, stage);
  window.scrollTo(0,0);
}
function actionBar(children){ return h("div",{class:"actionbar"},[ h("div",{class:"inner"},children) ]); }
function retryBar(o){
  const inner=[ h("div",{class:"verdict no",style:"margin:2px 0 12px"},[o.text||"Incorrect — want to try again?"]) ];
  if(o.onAgain) inner.push(h("button",{class:"btn big",onclick:o.onAgain},[o.againLabel||"Try again"]));
  if(o.extra) inner.push(o.extra);
  if(o.onShow) inner.push(h("button",{class:"override",onclick:o.onShow},[ h("u",null,[o.showLabel||"Show answer"]) ]));
  return h("div",{class:"actionbar"},[ h("div",{class:"inner"},inner) ]);
}

function grade(id, correct, elapsed, fast){
  const kind = session._kind;
  const it = ITEMS[id];
  const wasNew = !mem(id);
  // a quick 1-in-4 guess on a brand-new word is not "easy"
  if(kind==="mc" && wasNew) fast=false;
  const g = correct ? (fast?"easy":"good") : "again";
  review(id,g,now());
  touchStreak();   // the day counts as soon as you answer something, not only on "Finish"
  let celebrated=false;
  if(correct){
    let x = CFG.xp[kind]||8; if(g==="easy") x+=CFG.xp.easyBonus;
    session.correct++; session.combo++; session.bestCombo=Math.max(session.bestCombo,session.combo);
    profile.answerStreak.current=session.combo; if(session.combo>profile.answerStreak.best)profile.answerStreak.best=session.combo;
    session.advanced.add(id);
    if(!session.recordBroken && session.recordToBeat>=CFG.recordMin && session.combo>session.recordToBeat){
      // just passed your all-time best
      session.recordBroken=true; x+=CFG.xp.comboBonus; celebrate(session.combo, "new record!", true); celebrated=true;
    } else if(session.combo>0 && session.combo%CFG.comboEvery===0){
      x+=CFG.xp.comboBonus; const big=session.combo%100===0; celebrate(session.combo, big?"streak!":"combo!", big); celebrated=true;
    }
    session.xp+=x; addXP(x);
    sfx(celebrated?"win":"correct");
  } else {
    session.wrong++;
    session.combo=0; profile.answerStreak.current=0;
    // re-show this item once more, a few cards later
    if(!session._requeued) session._requeued={};
    if(!session._requeued[id]){ session._requeued[id]=1; const pos=Math.min(session.queue.length, session.i+3); session.queue.splice(pos,0,id); session.total=session.queue.length; }
    sfx("wrong");
  }
  save();
}
function advance(){ session.i++; nextCard(); }

/* ----- Multiple choice ----- */
function renderMC(id,kind,stage){
  session._kind="mc";
  const it=ITEMS[id];
  const isKana=it.tags[0]==="kana";
  // direction: kana -> either read it (kana→rōmaji) or recognise it (rōmaji→kana); words: mostly jp→en
  const jpToEn = isKana ? Math.random()<0.5 : Math.random()<0.6;
  const promptJp = jpToEn;   // prompt side is Japanese when we ask for the meaning
  const answer = jpToEn ? it.en : it.jp;
  const opts = shuffle([answer, ...distractors(id,!jpToEn,3)]);
  const start=now();

  stage.appendChild(h("div",{class:"kicker"},[ isKana ? (jpToEn?"How do you read this?":"Which kana is this?") : (jpToEn?"Choose the meaning":"Choose the Japanese") ]));
  const optLang = jpToEn ? "en-US" : "ja-JP";
  stage.appendChild(h("div",{class:"prompt"},[
    promptJp ? h("div",{class:"big serif"},[it.jp, speakerPair(it.jp,"ja-JP")]) : h("div",{class: isKana?"big":"en"},[it.en, speakerPair(isKana?it.jp:it.en, isKana?"ja-JP":"en-US")]),
    promptJp && !isKana ? h("div",{class:"rd"},[it.romaji]) : null
  ]));
  // kana "how do you read this?" — hearing it IS the answer, so stay quiet; the 🔊 button still works
  if(!(isKana && promptJp)) autoSpeak(promptJp ? it.jp : (isKana ? it.jp : it.en), (promptJp||isKana) ? "ja-JP" : "en-US");
  const box=h("div",{class:"choices"+(isKana&&!jpToEn?" grid2":"")});
  let ended=false, tries=0, rb=null;
  const reveal=()=>{ Array.from(box.children).forEach(c=>{ if(c.classList.contains("wrong"))return; if(c.textContent===answer)c.classList.add("correct"); else c.classList.add("dim"); }); };
  const finish=(cv)=>{ if(ended)return; ended=true; if(rb){rb.remove();rb=null;} reveal(); showContinue(stage,cv); };
  opts.forEach(v=>{
    const b=h("button",{class:"choice"+(isKana&&!jpToEn?" kana-choice":"")},[ h("span",{class: jpToEn?"":"jpc"},[v]) ]);
    b.addEventListener("click",()=>{
      if(ended)return;
      const ok=(v===answer); const elapsed=now()-start;
      if(!muted()){
        if(isKana && jpToEn){ if(ok) speak(it.jp,"ja-JP",false); }   // rōmaji labels aren't speakable; only confirm the right one
        else speak(v, optLang, false);
      }
      if(rb){ rb.remove(); rb=null; }
      if(ok){ grade(id, true, elapsed, tries===0 && elapsed<3500); b.classList.add("correct"); finish(true); return; }
      b.classList.add("wrong"); b.appendChild(h("span",{class:"badge"},["✕"])); b.style.pointerEvents="none";
      tries++;
      if(tries>=2){ grade(id, false, elapsed, false); finish(false); return; }   // missed the retry → break streak
      rb=retryBar({ text:"Not quite — pick another. (Miss again and the streak resets.)", onShow:()=>{ grade(id,false,elapsed,false); finish(false); } });
      document.getElementById("app").appendChild(rb);
    });
    box.appendChild(b);
  });
  stage.appendChild(box);
}

/* ----- Build from parts ----- */
// A lone は / へ tile is a particle: TTS should say "wa" / "e", not "ha" / "he".
function tileReading(p){ return p==="は" ? "わ" : p==="へ" ? "え" : p; }
function renderBuild(id,kind,stage){
  session._kind="build";
  const it=ITEMS[id];
  const parts=it.parts;
  stage.appendChild(h("div",{class:"kicker"},["Build the sentence"]));
  stage.appendChild(h("div",{class:"prompt"},[ h("div",{class:"en"},[it.en, speakerPair(it.en,"en-US")]) ]));
  autoSpeak(it.en, "en-US");
  const line=h("div",{class:"answer-line"});
  const bank=h("div",{class:"bank"});
  const placed=[];
  const tiles = shuffle(parts.map((p,idx)=>({p,idx})));
  tiles.forEach(o=>{
    const tb=h("button",{class:"tile"},[o.p]);
    tb.addEventListener("click",()=>{
      if(tb.classList.contains("used"))return;
      if(!muted()) speak(tileReading(o.p), "ja-JP", false);
      tb.classList.add("used");
      const pt=h("button",{class:"tile placed"},[o.p]);
      pt.addEventListener("click",()=>{ pt.remove(); tb.classList.remove("used"); const k=placed.indexOf(o); if(k>=0)placed.splice(k,1); });
      placed.push(o); line.appendChild(pt);
    });
    bank.appendChild(tb);
  });
  stage.appendChild(line); stage.appendChild(bank);

  const start=now();
  const check=h("button",{class:"btn big"},["Check"]);
  const bar=actionBar([check]);
  let ended=false, tries=0, rb=null;
  const okNode=()=>h("div",{class:"verdict ok"},["◎ "+it.romaji, speakerPair(it.jp,"ja-JP")]);
  const ansNode=()=>h("div",{class:"verdict no"},[ h("span",null,["Answer: ", h("span",{class:"sol"},[it.jp]), "  ("+it.romaji+")"]), speakerPair(it.jp,"ja-JP") ]);
  const finish=(cv, node)=>{ if(ended)return; ended=true; if(rb){rb.remove();rb=null;} if(bar.isConnected)bar.remove(); if(node){ stage.appendChild(node); autoSpeak(it.jp,"ja-JP"); } showContinue(stage,cv); };
  check.addEventListener("click",()=>{
    if(ended || !placed.length)return;
    const ok = placed.map(o=>o.p).join("|")===parts.join("|");
    const elapsed=now()-start;
    if(ok){ grade(id, true, elapsed, tries===0 && elapsed<7000); line.classList.add("correct"); finish(true, okNode()); return; }
    line.classList.add("wrong");
    tries++;
    if(tries>=2){ grade(id, false, elapsed, false); finish(false, ansNode()); return; }   // missed the retry → break streak
    if(bar.isConnected)bar.remove();
    rb=retryBar({ text:"Not quite — try again. (Miss again and the streak resets.)", againLabel:"Try again", onAgain:()=>{ if(rb){rb.remove();rb=null;} line.classList.remove("wrong"); document.getElementById("app").appendChild(bar); }, onShow:()=>{ grade(id,false,elapsed,false); finish(false, ansNode()); } });
    document.getElementById("app").appendChild(rb);
  });
  document.getElementById("app").appendChild(bar);
}

/* ----- Type / translate ----- */
function renderType(id,kind,stage){
  session._kind="type";
  const it=ITEMS[id];
  const isKana=it.tags[0]==="kana";
  // single kana: always show the kana, type its reading (that IS the skill).
  // words/phrases: kana mode → show EN, type in kana; rōmaji mode → 40% read kana aloud in rōmaji, else EN → rōmaji
  const useKana = !isKana && kanaMode();
  const showJp = isKana ? true : (useKana ? false : Math.random()<0.4);
  stage.appendChild(h("div",{class:"kicker"},[ isKana?"Type the reading in rōmaji": useKana?"Type it in Japanese": showJp?"Type the rōmaji":"Type it in rōmaji" ]));
  stage.appendChild(h("div",{class:"prompt"},[
    showJp? h("div",{class:"big serif"},[it.jp, speakerPair(it.jp,"ja-JP")]) : h("div",{class:"en"},[it.en, speakerPair(it.en,"en-US")])
  ]));
  if(!showJp) autoSpeak(it.en, "en-US");   // showing the kana and asking for its reading — don't say it
  const inp=h("input",{class:"type-in",type:"text",autocapitalize:"none",autocomplete:"off",autocorrect:"off",spellcheck:"false",
    placeholder: useKana?"ひらがな…":"rōmaji…", lang: useKana?"ja":"en", inputmode:"text"});
  stage.appendChild(inp);
  const verdict=h("div",{class:"verdict"}); stage.appendChild(verdict);
  setTimeout(()=>inp.focus(),60);
  const start=now();

  // never accept what is already on screen; in kana mode the answer must be kana; in rōmaji mode kana is also fine
  const alts=(it.alt||[]).map(norm);
  const accepts = useKana ? [norm(it.jp)] : (showJp ? [norm(it.romaji)] : [norm(it.romaji), norm(it.jp)]).concat(alts);
  const check=h("button",{class:"btn big"},["Check"]);
  const bar=actionBar([check]);
  document.getElementById("app").appendChild(bar);
  let ended=false, tries=0, rb=null;

  const finish=(correct)=>{ if(ended)return; ended=true; if(rb){rb.remove();rb=null;} inp.disabled=true; inp.classList.remove("correct","wrong"); inp.classList.add(correct?"correct":"wrong"); verdict.className="verdict "+(correct?"ok":"no"); verdict.replaceChildren(correct? document.createTextNode("◎ "+(useKana? it.jp+"  ("+it.romaji+")" : it.romaji)) : h("span",null,["Answer: ", h("span",{class:"sol"},[useKana?it.jp:it.romaji]), "  ("+(useKana?it.romaji:it.jp)+")"]), speakerPair(it.jp,"ja-JP")); if(bar.isConnected)bar.remove(); autoSpeak(it.jp,"ja-JP"); showContinue(stage, correct); };
  function doCheck(){
    if(ended || rb)return;   // retry bar is showing: wait for "Try again"
    const raw=inp.value.trim();
    if(useKana && raw && isLatinOnly(raw)){   // still on the Latin keyboard — nudge, don't burn a try
      verdict.className="verdict no"; verdict.textContent="Type in kana — switch your keyboard with the 🌐 key"; return;
    }
    const val=norm(inp.value);
    if(!val)return;
    const ok = accepts.includes(val);
    const elapsed=now()-start;
    if(ok){ grade(id,true,elapsed, tries===0 && elapsed<5000); finish(true); return; }
    inp.classList.add("wrong");
    tries++;
    if(tries>=2){ grade(id,false,elapsed,false); finish(false); return; }   // missed the retry → break streak
    bar.remove();
    verdict.className="verdict"; verdict.textContent="";
    rb=retryBar({
      text:"Not quite — try again. (Miss again and the streak resets.)",
      onAgain:()=>{ if(rb){rb.remove();rb=null;} inp.classList.remove("wrong"); inp.value=""; inp.disabled=false; document.getElementById("app").appendChild(bar); setTimeout(()=>inp.focus(),30); },
      extra: h("button",{class:"override",onclick:()=>{ grade(id,true,elapsed,false); finish(true); }},[ h("u",null,["I was right — count it"]) ]),
      onShow:()=>{ grade(id,false,elapsed,false); finish(false); }
    });
    document.getElementById("app").appendChild(rb);
  }
  check.addEventListener("click",doCheck);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter")doCheck(); });
  if(!isKana) stage.appendChild(h("button",{class:"mode-link",onclick:()=>{ if(ended)return; profile.inputMode=kanaMode()?"romaji":"kana"; save(); if(bar.isConnected)bar.remove(); presentCard("type"); }},
    [ h("u",null,[ kanaMode()?"Switch to rōmaji typing":"Switch to kana typing" ]) ]));
}

function showContinue(stage, ok){
  const btn=h("button",{class:"btn big"+(ok?"":" shu"),onclick:advance},[ session.i+1>=session.queue.length?"Finish":"Continue" ]);
  document.getElementById("app").appendChild(actionBar([btn]));
  // Enter continues (deferred so the Enter that submitted the answer doesn't also advance)
  setTimeout(()=>{
    const onKey=e=>{ if(e.key==="Enter"){ document.removeEventListener("keydown",onKey); if(session && btn.isConnected) advance(); } };
    document.addEventListener("keydown",onKey);
    btn.addEventListener("click",()=>document.removeEventListener("keydown",onKey),{once:true});
  },0);
}

/* ----- sound: SFX (Web Audio) + pronunciation (Web Speech) ----- */
let _ac=null;
function ac(){ try{ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac&&_ac.state==="suspended")_ac.resume(); }catch(e){} return _ac; }
function tone(freqs, dur, type, gain){
  const c=ac(); if(!c)return; const t0=c.currentTime;
  freqs.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.value=f;
    const st=t0+i*(dur*0.55);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(gain||0.12, st+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, st+dur);
    o.connect(g); g.connect(c.destination); o.start(st); o.stop(st+dur+0.03);
  });
}
function sfx(kind){
  if(profile.sound===false) return;
  if(kind==="correct") tone([659.3,880],0.15,"sine",0.12);
  else if(kind==="wrong") tone([196,146.8],0.2,"sawtooth",0.07);
  else if(kind==="win") tone([523.3,659.3,784,1046.5],0.17,"triangle",0.11);
}
let _voices=[];
function loadVoices(){ try{ _voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }catch(e){ _voices=[]; } }
if(window.speechSynthesis){ loadVoices(); try{ window.speechSynthesis.addEventListener("voiceschanged",loadVoices); }catch(e){} }
function muted(){ return profile.sound===false; }
function speak(text, lang, slow){
  if(!("speechSynthesis" in window) || !text) return;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||"ja-JP"; u.rate= slow?0.5:0.9; u.pitch=1;
    if(!_voices.length) loadVoices();
    const v=_voices.find(v=>v.lang===u.lang) || _voices.find(v=>((v.lang||"").toLowerCase().replace("_","-")).indexOf((u.lang||"ja").slice(0,2))===0);
    if(v) u.voice=v;
    window.speechSynthesis.cancel();
    setTimeout(()=>{ try{ window.speechSynthesis.speak(u); }catch(e){} }, 40);   // cancel()+speak() back-to-back drops utterances on Chrome
  }catch(e){}
}
function autoSpeak(text, lang){ if(!muted()) speak(text, lang, false); }   // incidental audio: silenced by mute
function speakerPair(text, lang){  // 🔊 play + 🐢 slow — always play, even when muted (explicit)
  const wrap=h("span",{class:"spk-pair"});
  const p=h("button",{class:"spk","aria-label":"Play",html:"🔊"});
  p.addEventListener("click",e=>{ e.stopPropagation(); e.preventDefault(); speak(text,lang,false); });
  const s=h("button",{class:"spk","aria-label":"Play slowly",html:"🐢"});
  s.addEventListener("click",e=>{ e.stopPropagation(); e.preventDefault(); speak(text,lang,true); });
  wrap.appendChild(p); wrap.appendChild(s);
  return wrap;
}

/* ----- combo celebration ----- */
let _toastEl=null,_toastT=null;
function toast(msg){
  if(!_toastEl){ _toastEl=h("div",{class:"toast"}); document.body.appendChild(_toastEl); }
  _toastEl.textContent=msg; requestAnimationFrame(()=>_toastEl.classList.add("on"));
  clearTimeout(_toastT); _toastT=setTimeout(()=>{ if(_toastEl)_toastEl.classList.remove("on"); },1700);
}
function confetti(big){
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce) return;
  const colors=["#d24e24","#2a3c74","#5f7a43","#c1892e","#3b4f8f"];
  for(let i=0;i<(big?64:26);i++){
    const c=h("div",{class:"cf"});
    c.style.background=colors[i%colors.length];
    const x=Math.random()*100; c.style.left=x+"vw"; c.style.top="-20px";
    c.style.transform="rotate("+(Math.random()*360)+"deg)";
    fx.appendChild(c);
    const dx=(Math.random()-.5)*160, dur=900+Math.random()*700, rot=(Math.random()-.5)*720;
    c.animate([{transform:c.style.transform,opacity:1,offset:0},
      {transform:"translate("+dx+"px,"+(window.innerHeight+60)+"px) rotate("+rot+"deg)",opacity:.9}],
      {duration:dur,easing:"cubic-bezier(.3,.6,.4,1)",fill:"forwards"});
    setTimeout(()=>c.remove(),dur+50);
  }
}
function celebrate(n, label, big){
  const b=h("div",{class:"burst"},[ h("span",{class:"n serif"},[String(n)]), h("span",null,[label||"combo!"]) ]);
  document.body.appendChild(b); requestAnimationFrame(()=>b.classList.add("go"));
  setTimeout(()=>b.remove(),1200);
  confetti(big);
}
function levelUp(lv){
  const b=h("div",{class:"burst lvl"},[ h("span",null,["LEVEL"]), h("span",{class:"n serif"},[String(lv)]) ]);
  document.body.appendChild(b); requestAnimationFrame(()=>b.classList.add("go"));
  setTimeout(()=>b.remove(),1700);

/* ---------------- Complete ---------------- */
function finishSession(early){
  save();
  const s=session;
  const acc = (s.correct+s.wrong)? Math.round(s.correct/(s.correct+s.wrong)*100):0;
  let masteredGain=0;
  if(s.topicId){ masteredGain = topicStats(TOPIC[s.topicId]).mastered - s.startTopic; }
  const c=h("div",{class:"complete"});
  c.appendChild(h("div",{class:"seal serif"},[ acc>=100?"優": acc>=80?"良":"可" ]));
  c.appendChild(h("h2",null,[ early?"Lesson paused":"Lesson complete" ]));
  c.appendChild(h("p",{class:"lead"},[ profile.name? ("Nice work, "+profile.name+"."):"Nice work." ]));
  c.appendChild(h("div",{class:"result-grid"},[
    h("div",{class:"result"},[ h("div",{class:"rk"},["✦ XP earned"]), h("div",{class:"rv"},["+"+s.xp]) ]),
    h("div",{class:"result"},[ h("div",{class:"rk"},["Accuracy"]), h("div",{class:"rv"},[acc+"%"]) ]),
    h("div",{class:"result"},[ h("div",{class:"rk"},["🔥 Streak peak"]), h("div",{class:"rv"},[String(s.bestCombo)]) ]),
    h("div",{class:"result"},[ h("div",{class:"rk"},["Words practiced"]), h("div",{class:"rv"},[String(s.advanced.size)]) ])
  ]));
  if(masteredGain>0) c.appendChild(h("p",{class:"lead"},["🎉 "+masteredGain+" new word"+(masteredGain>1?"s":"")+" mastered!"]));
  const src=s.source, tid=s.topicId;
  const startNext=()=>{
    let built = (src==="daily") ? buildDaily() : (tid ? buildTopicLesson(tid) : buildDaily());
    if(!built || !built.queue.length){ built=buildDaily(); }
    if(built && built.queue.length) startSession(built, {source: (src==="daily"||!tid)?"daily":"topic", topicId: tid});
    else renderHome();
  };
  c.appendChild(h("div",{style:"display:flex; gap:10px"},[
    h("button",{class:"btn big",style:"flex:1",onclick:startNext},["Next lesson"]),
    h("button",{class:"btn ghost big",style:"flex:1",onclick:renderHome},["Back to course"])
  ]));
  const wrap=h("div",{class:"wrap"}); wrap.appendChild(c);
  app.replaceChildren(h("div",{class:"topbar"},[ h("div",{class:"brand"},[h("span",{class:"mark serif"},["クベバ"])]) ]), wrap);
  if(!early && acc>=80) setTimeout(()=>celebrate(acc+"%", acc>=100?"perfect!":"nice!"),200);
}

/* ---------------- Theme ---------------- */

/* ---------------- Boot ---------------- */
function boot(){
  try{
    initStore();
    if(profile.theme) document.documentElement.setAttribute("data-theme",profile.theme);
    renderHome();
    if(storeCorrupt) toast("⚠ Saved progress was unreadable — starting fresh (old copy kept)");
  }catch(e){
    app.replaceChildren(h("div",{class:"center-screen"},[
      h("div",{class:"mark serif",style:"font-size:40px"},["クベバ"]),
      h("p",{class:"muted",style:"text-align:center"},["Something went wrong while starting. Try updating your browser."]),
      h("pre",{class:"muted",style:"font-size:11px;white-space:pre-wrap"},[String(e&&e.message||e)])
    ]));
  }
}
boot();

})();
</script>
</body>
</html>
